# dump_dir: !!!CHANGE_THIS!!!
dump_dir: /path/to/data_recreation-bos-eos-2/meta-llama-Llama-3.2-1B
name: meta-llama-Llama-3.2-1B
steps: 100_000
# steps: 60_000
probe_freq: null
seed: 777
grad_acc_steps: 8

optim:
  lr: 3e-3
  weight_decay: 0.033
  warmup: 5000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  compile: true
  tp_size: 1
  # tp_size: 2
  # compile: false 

model:
  dim: 2048
  n_layers: 25
  n_heads: 16
  vocab_size: 851586

data:
  root_dir: /path/to/data/
  sources:
    fw_edu: 0.4
    ita_Latn: 0.15
    tur_Latn: 0.15
    cmn_Hani: 0.15
    fas_Arab: 0.15
  batch_size: 4
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_eos: true
  tokenizer:
    name: huggingface
    path: meta-llama/Llama-3.2-1B

profiling:
  run: true
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  init_ckpt_path: /path/to/tokenizers/meta-llama-Llama-3.2-1B/model_dcp
  dump:
    every: 1000
    keep: 1
  eval:
    every: 1000000
    keep: -1

logging:
  freq: 1
  wandb: 
    project: supertoken-training-data-recreation
    entity: gsaltintas
    tags: 
      - pre-training
      - debug
    group: meta-llama-Llama-3.2-1B
    # group: llama-3.2
    # name: Optional[str] = None
    # notes: Optional[str] = None
    sync_tensorboard: true
    # resume_from: Optional[str] = None

async_eval_gpus: 8
eval:
  harness:
    tasks:
      - hellaswag
      - piqa
      - arc_easy
      - arc_challenge

      - include_base_44_turkish
      - include_base_44_italian
      - include_base_44_chinese

      - belebele_pes_Arab
      - belebele_eng_Latn
      - belebele_ita_Latn
      - belebele_tur_Latn
      - belebele_zho_Hans

      - xnli_en
      - xnli_tr
      - xnli_zh

      # - humaneval
    confirm_run_unsafe_code: true

  # validation:
  #   max_steps: 1000
  generator:
    max_tokens: 16384
    dtype: bf16
    add_bos: False
